<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dicionário de Italiano | Idiomas Academy</title>
    <link rel="icon" type="image/png" href="../../favicon.png">
    <link rel="manifest" href="../../manifest.json">
    <meta name="theme-color" content="#15803d">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css?v=28f">
    <style>
        .italian-dictionary { --current-primary:#15803d; }
        .italian-dictionary .dict-search-input-field { width:100%;box-sizing:border-box;padding:16px 20px;border-radius:16px;background:var(--card-bg);color:var(--text-main);border:2px solid var(--border-color);font-size:1rem;font-weight:600;outline:none;box-shadow:var(--shadow); }
        .italian-dictionary .dict-search-input-field:focus { border-color:#15803d;box-shadow:0 0 0 4px rgba(21,128,61,.15); }
    </style>
</head>
<body data-mode="italiano" data-lang="it-IT" class="italian-dictionary">
    <header>
        <a href="../../hub_italiano.html" class="home-btn">⬅ Italiano</a>
        <h1>🇮🇹 Dicionário Essencial de Italiano</h1>
        <p>Alfabeto, vocabulário e gramática dos níveis A1 a B2, com áudio em italiano.</p>
    </header>
    <main class="container" style="max-width:900px;margin:0 auto;padding:20px;">
        <div class="dict-search-wrapper" style="margin-bottom:1.2rem;">
            <input type="search" id="dict-search-input" class="dict-search-input-field" aria-label="Pesquisar no dicionário italiano" oninput="filtrarGlossarioDebounced(this.value)" placeholder="Pesquise em italiano, português, tema, nível ou regra gramatical...">
        </div>
        <div class="dict-filters-row" style="display:flex;gap:.5rem;margin-bottom:.8rem;flex-wrap:wrap;justify-content:center;">
            <button class="dict-filter-pill active" data-cat="tudo" onclick="selecionarCategoriaDicionario('tudo')">🌐 Tudo</button>
            <button class="dict-filter-pill" data-cat="alphabet" onclick="selecionarCategoriaDicionario('alphabet')">🔤 Alfabeto</button>
            <button class="dict-filter-pill" data-cat="vocab" onclick="selecionarCategoriaDicionario('vocab')">📚 Vocabulário</button>
            <button class="dict-filter-pill" data-cat="grammar" onclick="selecionarCategoriaDicionario('grammar')">💡 Gramática</button>
            <button class="dict-filter-pill" data-cat="favoritos" onclick="selecionarCategoriaDicionario('favoritos')">⭐ Favoritos</button>
        </div>
        <div id="dict-subfilters-level" class="dict-subfilters-row" style="display:flex;margin-bottom:1rem;gap:.4rem;justify-content:center;flex-wrap:wrap;">
            <button class="dict-subfilter-pill-vocab active" data-sub-vocab="tudo" onclick="selecionarSubNivelVocab('tudo')">Todos (A1-B2)</button>
            <button class="dict-subfilter-pill-vocab" data-sub-vocab="A1" onclick="selecionarSubNivelVocab('A1')">🟢 Nível A1</button>
            <button class="dict-subfilter-pill-vocab" data-sub-vocab="A2" onclick="selecionarSubNivelVocab('A2')">🟡 Nível A2</button>
            <button class="dict-subfilter-pill-vocab" data-sub-vocab="B1" onclick="selecionarSubNivelVocab('B1')">🟠 Nível B1</button>
            <button class="dict-subfilter-pill-vocab" data-sub-vocab="B2" onclick="selecionarSubNivelVocab('B2')">🔴 Nível B2</button>
        </div>
        <div id="dict-results-counter" style="font-size:.88rem;color:var(--text-muted);font-weight:600;margin-bottom:1rem;">Carregando dicionário italiano...</div>
        <div id="dict-results-container" class="grid-dict-results" aria-busy="true" aria-label="Carregando dicionário" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;">
            <div class="dict-skeleton-card" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
            <div class="dict-skeleton-card" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
            <div class="dict-skeleton-card" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        </div>
    </main>

    <script src="../../database/it-IT/data_dicionario_index.js"></script>
    <script type="module" src="../../firebase-init.js"></script>
    <script src="../../js/core/config.js"></script><script src="../../js/core/constants.js"></script><script src="../../js/core/state.js"></script><script src="../../js/core/utils.js"></script><script src="../../js/core/theme.js"></script><script src="../../js/core/audio.js"></script><script src="../../js/core/toast.js"></script><script src="../../js/core/storage.js"></script><script src="../../js/core/dom.js"></script><script src="../../js/core/dictionary.js"></script><script src="../../js/core/events.js"></script><script src="../../js/game/xp.js"></script><script src="../../js/game/ranking.js"></script><script src="../../js/core/course-index.js"></script><script src="../../js/srs/engine.js"></script><script src="../../js/srs/deck.js"></script><script src="../../js/srs/review.js"></script><script src="../../js/core/bootstrap.js"></script><script src="../../app.js"></script>
</body>
</html>
