<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso de Katakana - Japão Academy</title>

    <link rel="icon" type="image/png" sizes="32x32" href="../../favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../favicon.png">
    <link rel="apple-touch-icon" href="../../favicon.png">

    <link rel="manifest" href="../../manifest.json">
    <meta name="theme-color" content="#1e1b4b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+JP:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../style.css?v=28f">
    <script src="https://unpkg.com/wanakana@5.3.1/wanakana.min.js"></script>
</head>

<body data-mode="katakana">
    <header>
        <a href="../../hub_japones.html" class="home-btn">⬅ Menu Inicial</a>
        <button class="theme-btn" onclick="toggleTheme()" title="Alternar Tema">🌙</button>
        <h1 id="mainTitle">Curso de Katakana</h1>
        <p id="mainDesc">Sons estrangeiros (Teoria, Vocabulário e Prática Completa).</p>
    </header>

    <div class="container">
        <!-- BANNER DE REVISÃO SRS DE KATAKANA -->
        <div class="banner-srs" style="border-color: rgba(2, 128, 144, 0.4);" aria-busy="true">
            <div class="srs-banner-info">
                <span class="srs-badge-tag"
                    style="background: rgba(2, 128, 144, 0.2); color: #00b4d8; border-color: #028090;">🌊 REPETIÇÃO
                    ESPAÇADA (KATAKANA)</span>
                <h3>Revisão Inteligente da Memória</h3>
                <p id="srs-banner-desc">Carregando itens pendentes de revisão...</p>
            </div>
            <div class="srs-banner-action">
                <div class="srs-badge-box">
                    <span class="srs-counter-badge" id="srs-badge-count">0</span>
                    <small>pendentes</small>
                </div>
                <button id="btn-iniciar-srs" onclick="iniciarSessaoSRS('katakana')" class="btn-srs-action"
                    style="background: linear-gradient(135deg, #028090, #00a896);">
                    Iniciar Revisão ➔
                </button>
            </div>
        </div>

        <div id="study-area" style="display: block;">
            <div class="tabs" id="tabContainer" aria-busy="true" aria-label="Carregando módulos"></div>
            <main id="moduleDisplay" class="module-content" aria-busy="true" aria-label="Carregando módulo"></main>
        </div>

        <!-- PLAYER DE REPETIÇÃO ESPAÇADA (SRS) -->
        <main id="player-srs" style="display: none;">
            <div class="barra-progresso">
                <span id="srs-etapa-titulo">Revisão SRS (1 de 1)</span>
                <button onclick="fecharSessaoSRS()">✖ Sair da Revisão</button>
            </div>

            <div id="conteudo-card-srs" class="srs-container-flex"></div>

            <div class="srs-botoes-acao">
                <button id="btn-revelar-srs" onclick="revelarRespostaSRS()" class="btn-srs-reveal">
                    Ver Resposta 👁️
                </button>

                <div id="painel-avaliacao-srs" class="grid-avaliacao-srs" style="display: none;">
                    <button onclick="processarAvaliacaoSRS(1)" class="btn-srs-again">
                        ❌ Errei
                        <small>Revisar amanhã</small>
                    </button>
                    <button onclick="processarAvaliacaoSRS(2)" class="btn-srs-hard">
                        🟡 Difícil
                        <small>Aumento leve</small>
                    </button>
                    <button onclick="processarAvaliacaoSRS(3)" class="btn-srs-good">
                        🟢 Bom
                        <small>Intervalo médio</small>
                    </button>
                    <button onclick="processarAvaliacaoSRS(4)" class="btn-srs-easy">
                        🌟 Fácil
                        <small>Intervalo longo</small>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="../../database/ja-JP/data_katakana.js"></script>
    <script type="module" src="../../firebase-init.js"></script>
    <script src="../../js/core/config.js"></script>
    <script src="../../js/core/constants.js"></script>
    <script src="../../js/core/state.js"></script>
    <script src="../../js/core/utils.js"></script>
    <script src="../../js/core/theme.js"></script>
    <script src="../../js/core/audio.js"></script>
    <script src="../../js/core/toast.js"></script>
    <script src="../../js/core/storage.js"></script>
    <script src="../../js/core/dom.js"></script>
    <script src="../../js/core/dictionary.js"></script>
    <script src="../../js/core/events.js"></script>
    <script src="../../js/course/tabs.js"></script>
    <script src="../../js/course/course.js"></script>
    <script src="../../js/course/quiz.js"></script>
    <script src="../../js/phrasal/navigation.js"></script>
    <script src="../../js/phrasal/render.js"></script>
    <script src="../../js/pronunciation/render.js"></script>
    <script src="../../js/pronunciation/speech-recognition.js"></script>
    <script src="../../js/pronunciation/quiz.js"></script>
    <script src="../../js/kanji/kanji-render.js"></script>
    <script src="../../js/kanji/kanji-canvas.js"></script>
    <script src="../../js/game/xp.js"></script>
    <script src="../../js/game/ranking.js"></script>
    <script src="../../js/game/minigames.js"></script>
    <script src="../../js/srs/engine.js"></script>
    <script src="../../js/srs/deck.js"></script>
    <script src="../../js/srs/review.js"></script>
    <script src="../../js/core/bootstrap.js"></script>
    <script src="../../app.js"></script>
</body>

</html>
