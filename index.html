<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idiomas Academy</title>

    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1b4b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+JP:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <style>
        /* Botão do Inglês perfeitamente padronizado com as dimensões da plataforma */
        .course-btn.english {
            background: linear-gradient(135deg, #1d4ed8, #1e3a8a);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .course-btn.english:hover {
            border-color: #60a5fa;
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(29, 78, 216, 0.4), 0 0 15px rgba(96, 165, 250, 0.3);
        }
    </style>
</head>

<body data-mode="curso">
    <header>
        <button class="theme-btn" onclick="toggleTheme()" title="Alternar Tema">🌙</button>
        <h1 id="mainTitle">🌐 Idiomas Academy</h1>
        <p id="mainDesc">Escolha o idioma que deseja aprender e inicie sua jornada guiada de estudos.</p>
    </header>

    <div class="container">
        <div id="main-menu">

            <!-- OPÇÃO 1: HUB DO JAPONÊS -->
            <a href="hub_japones.html" class="course-btn japa">
                <span>🎌</span>
                Japonês
                <p>Curso Completo, Hiragana, Katakana, Kanjis e Minigame</p>
            </a>

            <!-- OPÇÃO 2: HUB DO INGLÊS -->
            <a href="hub_ingles.html" class="course-btn english">
                <span>🗽</span>
                Inglês
                <p>Do Nível Básico ao Avançado (A1 a B2), Phrasal Verbs e Pronúncia</p>
            </a>

        </div>
    </div>

    <script type="module" src="firebase-init.js"></script>
    <script src="app.js"></script>
</body>

</html>
